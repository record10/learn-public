      // Apply theme and reduced motion on initial load

        if (theme === 'dark') {
          document.documentElement.classList.add('dark');

          (localStorage.getItem('reduce-motion') === null &&

        const isReduced = document.documentElement.classList.contains('reduce-motion');
        if (isReduced) {

      // Re-apply theme and reduced motion after swap (safety net)
